version: '1.0'

services:
  backend:
    depends_on:
      - db
    ports:
      - '3000:3000'
    env_file:
      - .env

  db:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
