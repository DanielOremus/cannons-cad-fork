services:
  db:
    image: postgres:17
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - redis_data:/data

    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: cannons-cad_mailpit
    restart: unless-stopped

    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

    ports:
      - "127.0.0.1:8025:8025"

    networks:
      - app_network

  db_migrations:
    build:
      context: ./
      dockerfile: ./backend/Dockerfile.dev
    container_name: cannons-cad_migrations
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: npx mikro-orm migration:up
    networks:
      - app_network

  backend:
    build:
      context: ./
      dockerfile: ./backend/Dockerfile.dev
    container_name: cannons-cad_backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      db_migrations:
        condition: service_completed_successfully

      mailpit:
        condition: service_started

    ports:
      - '${PORT}:${PORT}'
    networks:
      - app_network

volumes:
  db_data:
  redis_data:

networks:
  app_network:
    driver: bridge
